<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFDDC7">
<title>Family Sticker Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #FFEFDF;
    --bg-2: #E6F2FF;
    --card: #FFFFFF;
    --ink: #3A3A4A;
    --ink-soft: #8A8AA3;
    --coral-1: #FF7B6B;
    --coral-2: #FF9F5A;
    --purple: #7C6FF0;
    --teal: #2FBF8F;
    --ring: rgba(255, 90, 95, 0.25);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    min-height: 100vh;
    margin: 0;
    padding: 32px 16px 60px;
  }

  .app {
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
  }

  header { margin-bottom: 28px; }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .subtitle {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  /* --- Hold to talk --- */
  .talk-wrap { margin: 8px 0 20px; }

  #talkBtn {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, var(--coral-1), var(--coral-2));
    color: white;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    box-shadow: 0 10px 24px rgba(255, 123, 107, 0.4);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #talkBtn::before {
    content: "🎤";
    display: block;
    font-size: 2.2rem;
    margin-bottom: 6px;
  }

  #talkBtn:active { transform: scale(0.97); }

  #talkBtn.recording {
    background: linear-gradient(145deg, #FF5252, #FF7B6B);
    box-shadow: 0 0 0 14px var(--ring);
    transform: scale(1.05);
    animation: pulse 1.4s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 var(--ring); }
    70%  { box-shadow: 0 0 0 18px rgba(255, 90, 95, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 90, 95, 0); }
  }

  /* --- Type instead --- */
  details.type-instead {
    margin: 4px 0 24px;
  }

  details.type-instead summary {
    cursor: pointer;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.9rem;
    list-style: none;
  }

  details.type-instead summary::-webkit-details-marker { display: none; }

  details.type-instead[open] summary { margin-bottom: 12px; }

  #generateForm {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    font-family: inherit;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 12px 14px;
    border: 2px solid #ECE6FA;
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--purple);
  }

  #generateForm button {
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 0 18px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  #status {
    min-height: 1.3em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 14px;
  }

  #preview {
    background: var(--card);
    border-radius: 24px;
    padding: 12px;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(58, 58, 74, 0.08);
  }

  #preview .placeholder {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.6;
  }

  #preview .placeholder .icon {
    font-size: 2.2rem;
    display: block;
  }

  #preview img {
    max-width: 100%;
    border-radius: 14px;
    animation: pop-in 0.3s ease;
  }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }

  .actions button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    cursor: pointer;
    color: white;
  }

  #regenerateBtn { background: var(--purple); }
  #printBtn { background: var(--teal); }

  .actions button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🖍️ Family Sticker Machine</h1>
      <p class="subtitle">Say it, see it, stick it!</p>
    </header>

    <div class="talk-wrap">
      <button id="talkBtn">Hold to Talk</button>
    </div>

    <details class="type-instead">
      <summary>⌨️ or type an idea instead</summary>
      <form id="generateForm">
        <input type="text" id="subject" placeholder="a happy sun...">
        <button type="submit">Generate</button>
      </form>
    </details>

    <div id="status"></div>
    <div id="preview">
      <div class="placeholder"><span class="icon">🎨</span>Your sticker will<br>appear here</div>
    </div>

    <div class="actions">
      <button id="regenerateBtn" hidden>🔄 Regenerate</button>
      <button id="printBtn" hidden>🖨️ Print</button>
    </div>
  </div>

  <script>
    const form = document.getElementById("generateForm");
    const subjectInput = document.getElementById("subject");
    const statusEl = document.getElementById("status");
    const previewEl = document.getElementById("preview");
    const regenerateBtn = document.getElementById("regenerateBtn");
    const printBtn = document.getElementById("printBtn");
    const talkBtn = document.getElementById("talkBtn");

    function showResult(subject, image) {
      subjectInput.value = subject;
      previewEl.innerHTML = `<img src="${image}" alt="${subject}">`;
      regenerateBtn.hidden = false;
      printBtn.hidden = false;
    }

    async function doPrint() {
      statusEl.textContent = "Printing...";
      try {
        const res = await fetch("/print", { method: "POST" });
        const data = await res.json();
        statusEl.textContent = res.ok ? "Sent to printer." : (data.error || "Print failed.");
      } catch (err) {
        statusEl.textContent = "Print request failed: " + err.message;
      }
    }

    async function generate() {
      const subject = subjectInput.value.trim();
      if (!subject) {
        statusEl.textContent = "Please enter a sticker idea.";
        return;
      }

      statusEl.textContent = "Generating...";
      regenerateBtn.hidden = true;
      printBtn.hidden = true;

      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject }),
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || "Something went wrong.";
          return;
        }

        showResult(subject, data.image);
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = "Request failed: " + err.message;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      generate();
    });

    regenerateBtn.addEventListener("click", generate);
    printBtn.addEventListener("click", doPrint);

    // --- Hold to talk ---
    let mediaRecorder = null;
    let audioChunks = [];
    let micStream = null;

    function pickMimeType() {
      const candidates = ["audio/mp4", "audio/webm", "audio/ogg"];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
      }
      return "";
    }

    async function startRecording() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        statusEl.textContent = "Microphone access denied.";
        return;
      }
      const mimeType = pickMimeType();
      mediaRecorder = new MediaRecorder(micStream, mimeType ? { mimeType } : undefined);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.start();
      talkBtn.classList.add("recording");
      talkBtn.textContent = "Listening...";
      statusEl.textContent = "";
    }

    function stopRecording() {
      return new Promise((resolve) => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
          resolve(null);
          return;
        }
        mediaRecorder.onstop = () => {
          micStream.getTracks().forEach((t) => t.stop());
          const blob = audioChunks.length
            ? new Blob(audioChunks, { type: mediaRecorder.mimeType })
            : null;
          resolve(blob);
        };
        mediaRecorder.stop();
      });
    }

    async function handleTalkRelease() {
      talkBtn.classList.remove("recording");
      talkBtn.textContent = "Hold to Talk";

      const blob = await stopRecording();
      if (!blob || blob.size === 0) return;

      statusEl.textContent = "Thinking...";
      regenerateBtn.hidden = true;
      printBtn.hidden = true;

      const ext = (blob.type.split(";")[0].split("/")[1]) || "webm";
      const formData = new FormData();
      formData.append("audio", blob, `voice.${ext}`);

      try {
        const res = await fetch("/voice", { method: "POST", body: formData });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || "Something went wrong.";
          return;
        }

        showResult(data.subject, data.image);
        statusEl.textContent = `"${data.subject}" — printing...`;
        setTimeout(doPrint, 1500);
      } catch (err) {
        statusEl.textContent = "Request failed: " + err.message;
      }
    }

    talkBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      startRecording();
    });
    talkBtn.addEventListener("pointerup", handleTalkRelease);
    talkBtn.addEventListener("pointercancel", handleTalkRelease);
    talkBtn.addEventListener("pointerleave", () => {
      if (mediaRecorder && mediaRecorder.state === "recording") handleTalkRelease();
    });
  </script>
</body>
</html>
